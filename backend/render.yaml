databases:
  - name: expense-tracker-db
    databaseName: expense_tracker_db
    user: postgres
    plan: free

services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: TIME_ZONE
        value: "Asia/Kolkata"
