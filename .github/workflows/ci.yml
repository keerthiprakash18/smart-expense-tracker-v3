name: Smart Expense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-secret-key-that-is-long-enough-for-tests"
      THROTTLE_LOGIN: "1000/min"
      THROTTLE_REGISTER: "1000/hour"
      THROTTLE_TOKEN_REFRESH: "1000/hour"
      THROTTLE_SECURITY: "1000/hour"
      THROTTLE_PASSWORD_RESET: "1000/hour"
      THROTTLE_OCR: "1000/hour"
      THROTTLE_IMPORTS: "1000/hour"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test expenses
      - run: DEBUG=False SECRET_KEY="ci-production-security-key-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ" ALLOWED_HOSTS="example.com" CORS_ALLOWED_ORIGINS="https://example.com" python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
