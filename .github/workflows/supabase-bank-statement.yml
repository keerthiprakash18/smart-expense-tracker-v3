name: Supabase Bank Statement Phase 1
on:
  push:
    branches: [feature/supabase-bank-statements-phase1, feature/bank-statement-pdf-5mb, fix/bank-file-picker-mobile, fix/bank-pdf-hdfc-layouts]
  pull_request:
    branches: [feat/supabase-vercel-cutover]
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/bank-statement.test.js tests/bank-pdf-layout.test.js tests/bank-pdf-hdfc-layout.test.js tests/bank-file.test.js
      - run: npm run build
      - name: Generate synthetic password-protected PDF test fixtures
        run: |
          python3 -m pip install --break-system-packages pypdf==5.9.0
          python3 tests/generate-bank-pdfs.py
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test real PDF.js clear and encrypted bank statement imports
        run: npx playwright test --config tests/bank-pdf.playwright.config.js
      - name: Test actual mobile and desktop file picker in React screen
        run: npx playwright test --config tests/bank-picker.playwright.config.js

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install local PostgreSQL (test cluster only)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Migrations and PostgreSQL regression suite
        run: python -u supabase/tests/run_local.py --pg-bin "$(pg_config --bindir)"
